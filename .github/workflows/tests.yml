name: tests

# Runs AG's hermetic test suite on every push and pull request. The suite is pure
# stdlib + pytest: it stubs the model backends and uses the HashingEmbedder, so it needs
# no GPU, no Ollama, and no network. The GPU/Ollama/ComfyUI paths (LoRA training, live
# media generation) are exercised only through mocks here — the real hardware tests are
# local by nature and are not part of this suite.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # Base deps only (anthropic + pytest). The heavy LoRA extras
        # (requirements-lora.txt: torch/unsloth/…) are deliberately NOT installed — the
        # suite runs without them, and lora tests assert the graceful "deps missing" path.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
